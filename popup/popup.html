<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Down Beyond</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="popup-container">
    <header>
      <div class="logo-container">
        <img src="/icons/logo.png" alt="Down Beyond" class="header-logo-img">
      </div>
      <h1>Down Beyond</h1>
      <p class="subtitle">D&D Beyond Sheet Exporter</p>
    </header>

    <main>
      <div class="status-card" id="status-card">
        <span class="status-indicator" id="status-indicator"></span>
        <span class="status-text" id="status-text">Checking current page...</span>
      </div>

      <button id="export-btn" class="export-button disabled" disabled>
        <span class="btn-text">Export Markdown</span>
        <span class="spinner" id="btn-spinner"></span>
      </button>
    </main>

    <footer>
      <p>Compatible with Obsidian, NotebookLM, & Archivist</p>
    </footer>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
